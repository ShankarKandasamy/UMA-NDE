<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0f;
            color: #f0f0f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
        }
        h1 { font-size: 2rem; font-weight: 600; letter-spacing: 0.1em; }
        .subtitle { color: #8888aa; font-size: 0.9rem; margin-top: -1rem; }
        .apps {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 2rem 3rem;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 1rem;
            color: #f0f0f5;
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s;
        }
        a:hover { border-color: #00d4aa; transform: translateY(-2px); }
        .icon { font-size: 2.5rem; }
        .label { font-weight: 500; font-size: 1.1rem; }
        .desc { color: #8888aa; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>UMA</h1>
    <p class="subtitle">NDT Inspection Platform</p>
    <div class="apps">
        <a href="/capture/">
            <span class="icon">📸</span>
            <span class="label">Capture</span>
            <span class="desc">Record inspection data</span>
        </a>
        <a href="/viewer/">
            <span class="icon">🔍</span>
            <span class="label">Viewer</span>
            <span class="desc">Browse &amp; search files</span>
        </a>
    </div>
</body>
</html>
